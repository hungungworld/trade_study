name: probe-feeds
on:
  push:
    branches: [claude/trade-learning-website-ideas-bvdffz]
    paths: [scripts/probe-feeds.mjs, .github/workflows/probe-feeds.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: scripts
      - run: node scripts/probe-feeds.mjs

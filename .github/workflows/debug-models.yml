name: debug-models
on:
  push:
    branches: [claude/trade-learning-website-ideas-bvdffz]
    paths: [.github/workflows/debug-models.yml]
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          U=https://models.github.ai/inference/chat/completions
          B='{"model":"openai/gpt-4.1","max_tokens":20,"messages":[{"role":"user","content":"Say hi"}]}'
          probe() { echo "=== $1"; shift; curl -sS -o body.txt -D h.txt -w 'status=%{http_code} redirects=%{num_redirects} final=%{url_effective}\n' "$@"; grep -iE '^(content-type|location|x-ratelimit)' h.txt || true; head -c 400 body.txt; echo; }
          probe "1 vnd accept" -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" $U -d "$B"
          probe "2 json accept" -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" $U -d "$B"
          probe "3 follow redirects" -L -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" $U -d "$B"
          probe "4 catalog" -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" https://models.github.ai/catalog/models
          probe "5 legacy endpoint" -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" https://models.inference.ai.azure.com/chat/completions -d '{"model":"gpt-4.1","max_tokens":20,"messages":[{"role":"user","content":"Say hi"}]}'
